<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Art Pattern Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Pixel Art Pattern Generator</h1>
    <p class="header__subtitle">Turn any image into a gridded, colour limited pattern.</p>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="field">
        <label class="field__label" for="file">Image</label>
        <input class="file" type="file" id="file" accept="image/*">
      </div>

      <div class="field">
        <span class="field__label">Source area</span>
        <div class="seg">
          <label>
            <input type="radio" name="mode" value="whole" checked>
            <span>Whole image</span>
          </label>
          <label>
            <input type="radio" name="mode" value="area">
            <span>Select area</span>
          </label>
        </div>
        <canvas class="source" id="src" width="320" height="180"></canvas>
      </div>

      <div id="areaControls" hidden>
        <div class="field">
          <label class="field__label" for="z">
            Zoom <span class="field__value" id="zVal">1.0x</span>
          </label>
          <input class="range" type="range" id="z" min="1" max="4" step="0.1" value="1">
        </div>

        <div class="field">
          <label class="field__label" for="x">
            Left / right <span class="field__value" id="xVal">50</span>
          </label>
          <input class="range" type="range" id="x" min="0" max="100" value="50">
        </div>

        <div class="field">
          <label class="field__label" for="y">
            Up / down <span class="field__value" id="yVal">50</span>
          </label>
          <input class="range" type="range" id="y" min="0" max="100" value="50">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="g">
          Grid size (longest side) <span class="field__value" id="gVal">48</span>
        </label>
        <input class="range" type="range" id="g" min="16" max="96" value="48">
      </div>

      <div class="field">
        <label class="field__label" for="k">
          Colours <span class="field__value" id="kVal">10</span>
        </label>
        <input class="range" type="range" id="k" min="2" max="24" value="10">
      </div>

      <div class="field">
        <label class="field__label" for="s">
          Saturation boost <span class="field__value" id="sVal">1.2</span>
        </label>
        <input class="range" type="range" id="s" min="0.5" max="2" step="0.1" value="1.2">
      </div>

      <div class="field">
        <label class="field__label" for="c">
          Export cell size (px) <span class="field__value" id="cVal">10</span>
        </label>
        <input class="range" type="range" id="c" min="4" max="20" value="10">
      </div>

      <label class="check">
        <input type="checkbox" id="grid" checked>
        <span>Show grid lines</span>
      </label>

      <button class="btn" id="save" type="button">Download PNG</button>
    </aside>

    <section class="preview">
      <canvas class="preview__canvas" id="out"></canvas>
      <div class="palette" id="palette"></div>
    </section>
  </main>

<script src="script.js"></script>
</body>
</html>
